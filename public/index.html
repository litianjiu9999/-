<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Web App</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e3a8a 0%, var(--bg) 60%);
        color: var(--text);
      }
      .card {
        width: min(92vw, 460px);
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 { margin: 0 0 8px; font-size: 1.6rem; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
      .row { display: flex; gap: 10px; }
      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: #0b1220;
        color: var(--text);
        font-size: 1rem;
      }
      button {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #04283a;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      .result {
        margin-top: 22px;
        padding: 16px;
        border-radius: 10px;
        background: #0b1220;
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 1.2rem;
        min-height: 1.4em;
      }
      .result.empty { color: var(--muted); font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello Web App</h1>
      <p class="sub">A minimal Express + TypeScript demo for the Cloud Agent environment.</p>
      <label for="name">Your name</label>
      <div class="row">
        <input id="name" type="text" placeholder="e.g. Ada" autocomplete="off" />
        <button id="greet">Greet</button>
      </div>
      <div id="result" class="result empty">The greeting from <code>/api/hello</code> will appear here.</div>
    </main>
    <script>
      const input = document.getElementById("name");
      const button = document.getElementById("greet");
      const result = document.getElementById("result");

      async function greet() {
        const name = input.value.trim();
        const url = name ? `/api/hello?name=${encodeURIComponent(name)}` : "/api/hello";
        result.classList.remove("empty");
        result.textContent = "Loading…";
        try {
          const res = await fetch(url);
          const data = await res.json();
          result.textContent = data.message;
        } catch (err) {
          result.textContent = "Request failed: " + err;
        }
      }

      button.addEventListener("click", greet);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") greet();
      });
    </script>
  </body>
</html>
